<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ BRAND }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  {% block head %}{% endblock %}
  <style>
    :root {
      --bg: #f4f6f5; --surface: #fff; --fg: #1c2a2f; --muted: #56666d; --line: #d9e0e1; --accent: #0d5c63;
      --ok: #0a7a0a; --warn: #8a5a00; --serious: #b4501f; --bad: #b3261e; --r: 10px;
      --p1: #b3261e; --p2: #8a5a00; --p3: #6b6200;
      --c-ok: #0ca30c; --c-failed: #d03b3b; --c-none: #c3cdcf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1719; --surface: #162124; --fg: #e3ecee; --muted: #9bb0b6; --line: #27363a; --accent: #5fc4cc;
        --ok: #4cc94c; --warn: #fab219; --serious: #ec835a; --bad: #ff7b72;
        --p1: #ff7b72; --p2: #fab219; --p3: #d6c14a;
        --c-ok: #0ca30c; --c-failed: #d03b3b; --c-none: #3a4b4f;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 0 16px 56px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    h1, h2, h3 { line-height: 1.2; margin: 0; }
    h2 { font-size: 1.05rem; font-weight: 650; margin: 36px 0 12px; }
    code { font-size: 14px; }
    .muted { color: var(--muted); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .P1 { color: var(--p1); } .P2 { color: var(--p2); } .P3 { color: var(--p3); } .resolved { color: var(--ok); }
    .warn { color: var(--warn); } .failed, .problem, .overdue { color: var(--bad); } .running, .new { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 14px; }

    .top { display: flex; align-items: baseline; gap: 24px; padding: 18px 0 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { font-weight: 700; color: var(--fg); text-decoration: none; margin-right: auto; display: inline-flex; align-items: center; gap: 8px; }
    .brand-icon { border-radius: 6px; }
    .brand-version { color: var(--muted); font-weight: 400; font-size: 14px; }
    .top a.nav { text-decoration: none; color: var(--muted); padding: 4px 0; border-bottom: 2px solid transparent; }
    .top a.nav[aria-current] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }

    .ico { vertical-align: -3px; flex: none; }
    .s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-overdue { color: var(--serious); }
    .s-problem, .s-failed { color: var(--bad); } .s-new, .s-running { color: var(--muted); }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; font-weight: 600; }

    .hero { padding: 40px 0 8px; }
    .hero h1 { font: 600 clamp(2rem, 6vw, 3rem)/1.1 Georgia, "Iowan Old Style", "Times New Roman", serif; display: flex; align-items: center; gap: 14px; }
    .hero p { margin: 10px 0 0; color: var(--muted); }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
    .card + .card { margin-top: 10px; }
    .attn { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .attn li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: var(--r); padding: 12px 16px; }
    .attn li.warn, .attn li.overdue { border-left-color: var(--serious); }
    .attn a { font-weight: 600; }
    .check-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .check-head h3 { font-size: 1rem; }
    .headline { margin: 8px 0 0; }
    details { margin-top: 8px; } summary { cursor: pointer; color: var(--accent); font-size: .92rem; }
    details ul { margin: 8px 0 0; padding-left: 20px; }
    .check-foot { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: .88rem; color: var(--muted); }
    .strip .c-ok { fill: var(--c-ok); } .strip .c-failed { fill: var(--c-failed); }
    .strip .c-partial { fill: var(--c-ok); opacity: .45; } .strip .c-none { fill: none; stroke: var(--c-none); stroke-width: 1.5; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; align-items: center; }
    .chips .lab { color: var(--muted); font-size: .88rem; min-width: 64px; }
    .chip { text-decoration: none; color: var(--fg); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: .9rem; }
    .chip[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }

    .day { margin: 28px 0 6px; font-size: .95rem; font-weight: 650; }
    .events { list-style: none; margin: 0; padding: 0 0 0 4px; border-left: 2px solid var(--line); }
    .event { display: grid; grid-template-columns: 48px 22px minmax(0, 1fr); gap: 6px; padding: 8px 0 8px 12px; }
    .ev-body { overflow-wrap: anywhere; } /* a URL in a summary must not widen the page */
    .ev-time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; padding-top: 2px; }
    .ev-title { font-weight: 600; } .ev-sum, .ev-meta { font-size: .92rem; }
    .event.quiet .ev-title { font-weight: 450; color: var(--muted); }

    article.card { position: relative; }
    article.card.has-help .check-head h3 { padding-left: 32px; }
    details.help { margin-top: 0; }
    details.help > summary { list-style: none; position: absolute; top: 14px; left: 18px; cursor: pointer; }
    details.help > summary::-webkit-details-marker { display: none; }
    details.help > summary { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); background: var(--surface); }
    details.help[open] > summary, details.help > summary:hover { color: var(--accent); border-color: var(--accent); }
    .help-body { background: var(--bg); border-radius: var(--r); padding: 12px 14px; margin-top: 10px; font-size: .94rem; }
    .help-body p, .help-page p { margin: 0 0 8px; } .help-body p:last-child { margin: 0; }
    .k { color: var(--muted); }
    p.links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .9rem; }
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 20px 0; }
    dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; }
    @media (max-width: 560px) { .event { grid-template-columns: 42px 20px minmax(0, 1fr); } .chips .lab { width: 100%; } }
  </style>
</head>
<body><main>
<header class="top">
  <a class="brand" href="/ops"><img class="brand-icon" src="/static/pikett-icon.svg" alt="" width="24" height="24">{{ BRAND }}{% if VERSION %} <span class="brand-version">v{{ VERSION }}</span>{% endif %}</a>
  <a class="nav" href="/ops"{% if nav == 'ops' %} aria-current="page"{% endif %}>{{ t('web.nav.overview') }}</a>
  <a class="nav" href="/ops/history"{% if nav == 'history' %} aria-current="page"{% endif %}>{{ t('web.nav.history') }}</a>
  <a class="nav" href="/ops/help"{% if nav == 'help' %} aria-current="page"{% endif %}>{{ t('web.nav.help') }}</a>
  <a class="nav" href="/incidents"{% if nav == 'incidents' %} aria-current="page"{% endif %}>{{ t('web.nav.incidents') }}</a>
</header>
{% block content %}{% endblock %}</main></body>
</html>
