# App-level rules from span metrics (Alloy spanmetrics connector, computed from 100 % of the spans).
# Metric and label names keep their dots, so they are quoted. Only server spans count.
groups:
  - name: apps
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum by ("service.name") (rate({__name__="traces.span.metrics.calls","span.kind"="SPAN_KIND_SERVER","status.code"="STATUS_CODE_ERROR"}[5m]))
            / sum by ("service.name") (rate({__name__="traces.span.metrics.calls","span.kind"="SPAN_KIND_SERVER"}[5m]))
            > 0.05
          and sum by ("service.name") (rate({__name__="traces.span.metrics.calls","span.kind"="SPAN_KIND_SERVER"}[5m])) > 0.05
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: 'More than 5% of server spans of {{ index $labels "service.name" }} failed'

      - alert: SlowRoute
        expr: |
          histogram_quantile(0.95, sum by (le, "service.name", "span.name") (
            rate({__name__="traces.span.metrics.duration_bucket","span.kind"="SPAN_KIND_SERVER"}[5m])))
            > 1
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: 'p95 of {{ index $labels "span.name" }} ({{ index $labels "service.name" }}) is above 1 s'
