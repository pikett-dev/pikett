# /etc/needrestart/conf.d/ops.conf (ops).
# Restart services that use an updated library without asking (also when apt runs unattended).
$nrconf{restart} = 'a';
# Never restart the container runtime on its own: that would stop every app container. needrestart lists it
# instead, the collector reports it, and the daily digest names it.
$nrconf{override_rc}->{qr(^docker\.service$)} = 0;
$nrconf{override_rc}->{qr(^containerd\.service$)} = 0;
# Tailscale carries SSH and the telemetry; restart it only with the reboot.
$nrconf{override_rc}->{qr(^tailscaled\.service$)} = 0;
# Kernel updates are handled by reboot-required and the Slack question, not by a dialog.
$nrconf{kernelhints} = 0;
