# Runs on the app server next to Coolify. Every Coolify resource sits in the Docker network "coolify", Alloy joins
# it, so the apps reach it as http://alloy:4318 without any change to their network settings.
# Install and check with deploy/app-host/agent.sh.
name: ops-agent

services:
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    mem_limit: 768m  # measured at about 0.5 GB with a dozen containers
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      # otelcol.storage.file (persistent queue) is public-preview in this release.
      - --stability.level=public-preview
      # A directory: Alloy loads every *.alloy file in it as one configuration (config.alloy plus the local-*.alloy files
      # of your installation, see README.md). Subdirectories such as examples/ are not read.
      - /etc/alloy
    # Secrets for your own local-*.alloy files (Bearer tokens, database passwords), read there with sys.env. Created by
    # hand on the server, mode 600; agent.sh never writes or deletes it. Optional.
    env_file:
      - path: ./secrets.env
        required: false
    environment:
      OPS_SERVER: ${OPS_SERVER:?set OPS_SERVER to the Tailscale IP of the ops server}
      HOST_NAME: ${HOST_NAME:-app-1}
    # Host metrics (node exporter) and cAdvisor need host namespaces and the container runtime.
    pid: host
    # Root-equivalent access to this server; see "Known limits" in README.md for why it cannot be narrower.
    privileged: true
    # Without the host's cgroup view cAdvisor only sees its own cgroup and reports no single container.
    cgroup: host
    networks:
      - coolify
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host/rootfs:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # cAdvisor reads container names through containerd; without the socket it only reports the root cgroup.
      - /run/containerd:/run/containerd:ro
      - /var/log/journal:/var/log/journal:ro

networks:
  coolify:
    external: true

volumes:
  alloy-data:
